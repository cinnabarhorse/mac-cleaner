name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      MAC_CLEANER_OUTPUT_DIR: ${{ github.workspace }}/dist

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate tag and release metadata
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: release tags must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          echo "MAC_CLEANER_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "MAC_CLEANER_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Run tests
        run: swift test

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" ]]; then
            echo "error: Developer ID certificate secrets are missing" >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/mac-cleaner-signing.keychain-db"
          keychain_password="$(/usr/bin/openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          echo "MAC_CLEANER_RELEASE_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "MAC_CLEANER_RELEASE_CERTIFICATE=$certificate_path" >> "$GITHUB_ENV"

          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          /usr/bin/security create-keychain -p "$keychain_password" "$keychain_path"
          /usr/bin/security set-keychain-settings -lut 21600 "$keychain_path"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain_path"
          /usr/bin/security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          /usr/bin/security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          /usr/bin/security list-keychains -d user -s "$keychain_path"

          signing_identity="$(/usr/bin/security find-identity -v -p codesigning "$keychain_path" | \
            /usr/bin/sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | \
            /usr/bin/head -n 1)"
          if [[ -z "$signing_identity" ]]; then
            echo "error: imported certificate does not contain a usable Developer ID Application identity" >&2
            exit 1
          fi

          echo "MAC_CLEANER_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Prepare notarization API key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "$NOTARY_KEY_BASE64" || -z "$NOTARY_KEY_ID" || -z "$NOTARY_ISSUER_ID" ]]; then
            echo "error: notarization API key secrets are missing" >&2
            exit 1
          fi

          key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          echo "MAC_CLEANER_NOTARY_KEY=$key_path" >> "$GITHUB_ENV"
          printf '%s' "$NOTARY_KEY_BASE64" | /usr/bin/base64 -D > "$key_path"

          echo "MAC_CLEANER_NOTARY_KEY_ID=$NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "MAC_CLEANER_NOTARY_ISSUER=$NOTARY_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Build universal Developer ID release
        run: scripts/build-release.sh

      - name: Notarize and package release
        run: scripts/notarize-release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact="$MAC_CLEANER_OUTPUT_DIR/MacCleaner-$MAC_CLEANER_VERSION.zip"
          checksum="$artifact.sha256"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$artifact" "$checksum" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$artifact" \
              "$checksum" \
              --verify-tag \
              --generate-notes \
              --title "Mac Cleaner $MAC_CLEANER_VERSION"
          fi

      - name: Remove temporary credentials
        if: always()
        run: |
          if [[ -n "${MAC_CLEANER_RELEASE_KEYCHAIN:-}" ]]; then
            /usr/bin/security delete-keychain "$MAC_CLEANER_RELEASE_KEYCHAIN" || true
          fi
          if [[ -n "${MAC_CLEANER_RELEASE_CERTIFICATE:-}" ]]; then
            /bin/rm -f "$MAC_CLEANER_RELEASE_CERTIFICATE"
          fi
          if [[ -n "${MAC_CLEANER_NOTARY_KEY:-}" ]]; then
            /bin/rm -f "$MAC_CLEANER_NOTARY_KEY"
          fi
